# ============================================
# OFICINA (192.168.20.0/24)
# ============================================
subnet 192.168.20.0 netmask 255.255.255.0 {
    option routers 192.168.20.1;
    option domain-name-servers 8.8.8.8;
    
    # Pool para equipos DESCONOCIDOS (.100 - .150)
    pool {
        range 192.168.20.100 192.168.20.150;
        deny known-clients;    # Bloquea a los que tienen bloque 'host'
        # o alternativa: allow unknown-clients;
    }
    
    # Pool para equipos CONOCIDOS (.5 - .10)
    pool {
        range 192.168.20.5 192.168.20.10;
        deny unknown-clients;  # Solo los que tienen bloque 'host' definido
    }
}

# ============================================
# TALLER (192.168.67.0/24)
# ============================================
subnet 192.168.67.0 netmask 255.255.255.0 {
    option routers 192.168.67.1;
    option domain-name-servers 8.8.8.8;
    
    # Pool para equipos DESCONOCIDOS (.100 - .150)
    pool {
        range 192.168.67.100 192.168.67.150;
        deny known-clients;
    }
    
    # Pool para equipos CONOCIDOS (.5 - .10)
    pool {
        range 192.168.67.5 192.168.67.10;
        deny unknown-clients;
    }
}

# Tus hosts conocidos (sin fixed-address para que sean dinámicos)
host pc-oficina-1 {
    hardware ethernet 52:54:00:00:2f:aa;
}

host pc-oficina-2 {
    hardware ethernet 52:54:00:6c:37:52;
}

host pc-taller-1 {
    hardware ethernet 52:54:00:00:2f:aa;
}

host pc-taller-2 {
    hardware ethernet 52:54:00:6c:37:52;
}
